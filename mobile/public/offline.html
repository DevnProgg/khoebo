<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#E96B1A">
    <link rel="icon" href="/icons/favicon.png">
    <title>Offline | Khoebo</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
        background: #FFF8F3;
        color: #201A16;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      main {
        width: min(100%, 420px);
        padding: 32px 24px;
        border: 1px solid #F0E4DB;
        border-radius: 24px;
        background: #FFFFFF;
        text-align: center;
      }
      img { width: 84px; height: 84px; margin: 0 auto 20px; }
      h1 { margin: 0 0 8px; font-size: 26px; line-height: 32px; }
      p { margin: 0 0 24px; color: #72665E; font-size: 15px; line-height: 22px; }
      button {
        width: 100%;
        padding: 14px 18px;
        border: 0;
        border-radius: 14px;
        background: #E96B1A;
        color: #FFFFFF;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Khoebo">
      <h1>You're offline</h1>
      <p>Khoebo can't reach the server right now. Sales, stock and accounting need a connection before you continue.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
